name: 🤖 PR is ready to merge
on:
    pull_request_review:
        types: [submitted]

jobs:
    label-when-approved:
        name: Label when approved
        runs-on: ubuntu-latest
        if: github.event.review.state == 'approved'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: taiga-family/ci/actions/setup/variables@9b6ebca664f44d0fc34a50bec5f85becdf27d388 # v2.12.0
            - uses: taiga-family/ci/actions/auto/label-when-approved@9b6ebca664f44d0fc34a50bec5f85becdf27d388 # v2.12.0
              with:
                  approvals: 1
                  token: ${{ secrets.GITHUB_TOKEN }}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
